<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: a barra de abas usa env(safe-area-inset-*) para não ficar sob a barra de gestos do iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <link rel="icon" href="/favicon.svg" />
    <!-- instalável no iPhone: Safari → Compartilhar → Adicionar à Tela de Início (o iOS só usa ícone PNG) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FinApp" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>FinApp</title>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
